# grafana-httproute.yaml - Lets us open Grafana through the shared Gateway.
# "Requests for grafana.akashcloud.online go to the Grafana Service."
# (On EKS this will be protected further; for now it is only reachable inside the server.)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: shared-gateway
      namespace: envoy-gateway-system
  hostnames:
    - grafana.akashcloud.online
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
