# serviceaccount.yaml - The "identity" our pods run as inside Kubernetes.
# Later, on EKS, this identity can be linked to an AWS IAM role (IRSA).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
# The app never calls the Kubernetes API, so don't mount a token into the pod (safer).
automountServiceAccountToken: false
